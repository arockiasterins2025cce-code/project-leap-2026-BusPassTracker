spring.application.name=buspass
server.port=8090

# =========================================================
# Default database configuration (simple local setup)
# =========================================================
# Use embedded H2 by default so the app runs without a local MySQL install.
# If you prefer MySQL, switch back to the commented block below.
spring.datasource.url=jdbc:h2:mem:buspassdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# MySQL alternative (uncomment if you want to use MySQL)
# =========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/buspass_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=root26
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# API
# =========================================================
spring.jackson.serialization.write-dates-as-timestamps=false